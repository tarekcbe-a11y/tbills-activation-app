<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تفعيل الحاسبة - جروب عملاء البنوك المصرية</title>
    
    <!-- إعدادات تطبيق الويب والشاشة الكاملة (PWA) -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="حاسبة الأذون">
    <link rel="apple-touch-icon" href="logo.png">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            background-color: #0f172a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }
        .login-card {
            background: #1e293b;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 2px solid #ffd700;
        }
        .logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 2px solid #ffd700;
        }
        h2 {
            font-size: 20px;
            margin-bottom: 8px;
            color: #ffd700;
            font-weight: bold;
        }
        p {
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 25px;
            line-height: 1.5;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #0f172a;
            border: 1px solid #ffd700;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #ffd700;
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        button:active {
            opacity: 0.8;
        }
        .error {
            color: #ff4d4d;
            font-size: 13px;
            margin-top: 15px;
            min-height: 18px;
            line-height: 1.4;
        }
        .footer {
            margin-top: 25px;
            font-size: 11px;
            color: #ffd700;
            border-top: 1px solid rgba(255, 215, 0, 0.3);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="logo.png" alt="Logo" class="logo" onerror="this.style.display='none'">
        
        <h2>حاسبة أذون الخزانة</h2>
        <p>الرجاء إدخال كود التفعيل المخصص للوصول إلى الحاسبة</p>
        
        <input type="text" id="passcode" placeholder="أدخل كود التفعيل" autocomplete="off" onkeydown="if(event.key==='Enter') checkCode()">
        <button id="loginBtn" onclick="checkCode()">دخول</button>
        <div id="errorMsg" class="error"></div>

        <div class="footer">
            🛡️ جروب عملاء البنوك المصرية<br>Developed by Tarek Metwally
        </div>
    </div>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzMxBo2qe6zU7E_cnD_IQNh681UEfxb2N7IccU2EylGaqwsvjWuH4dpV7QNrsSLo5kH/exec";

        function getDeviceId() {
            let devId = localStorage.getItem("device_id");
            if (!devId) {
                devId = "DEV-" + Math.random().toString(36).substring(2, 10).toUpperCase() + "-" + Date.now().toString(36).toUpperCase();
                localStorage.setItem("device_id", devId);
            }
            return devId;
        }

        window.onload = function() {
            if (localStorage.getItem("is_logged_in") === "true") {
                window.location.href = "calculator.html";
            }
        };

        async function activateViaPost(code, deviceId) {
            const response = await fetch(WEB_APP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    action: "activate",
                    code: code,
                    deviceId: deviceId,
                    userAgent: navigator.userAgent
                })
            });
            if (!response.ok) throw new Error("Network response was not ok");
            return await response.json();
        }

        async function activateViaGet(code, deviceId) {
            const url = `${WEB_APP_URL}?action=activate&code=${encodeURIComponent(code)}&deviceId=${encodeURIComponent(deviceId)}`;
            const response = await fetch(url, { method: "GET" });
            if (!response.ok) throw new Error("Fallback GET failed");
            return await response.json();
        }

        async function checkCode() {
            const inputEl = document.getElementById("passcode");
            const btnEl = document.getElementById("loginBtn");
            const errorMsg = document.getElementById("errorMsg");

            const enteredCode = inputEl.value.trim();
            errorMsg.innerText = "";

            if (!enteredCode) {
                errorMsg.innerText = "من فضلك أدخل كود التفعيل أولاً.";
                return;
            }

            if (!navigator.onLine) {
                errorMsg.innerText = "لا يوجد اتصال بالإنترنت. يرجى الاتصال بالشبكة لتفعيل الكود.";
                return;
            }

            btnEl.disabled = true;
            btnEl.innerText = "جاري التحقق...";

            const deviceId = getDeviceId();

            try {
                let data;
                try {
                    data = await activateViaPost(enteredCode, deviceId);
                } catch (postErr) {
                    data = await activateViaGet(enteredCode, deviceId);
                }

                const isSuccess =
                    data &&
                    (data.success === true ||
                     data.valid === true ||
                     data.ok === true ||
                     data.status === "success" ||
                     data.status === "ok" ||
                     data.result === "success");

                if (isSuccess) {
                    localStorage.setItem("is_logged_in", "true");
                    localStorage.setItem("activated_code", enteredCode);
                    window.location.href = "calculator.html";
                } else {
                    errorMsg.innerText = (data && (data.message || data.error)) ||
                        "كود التفعيل غير صحيح أو تم استخدامه مسبقاً على جهاز آخر.";
                    btnEl.disabled = false;
                    btnEl.innerText = "دخول";
                }
            } catch (err) {
                errorMsg.innerText = "تعذر الاتصال بخادم التفعيل حالياً. تأكد من صلاحيات السكربت وحاول مرة أخرى.";
                btnEl.disabled = false;
                btnEl.innerText = "دخول";
            }
        }
    </script>

</body>
</html>
